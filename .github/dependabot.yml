# Weekly check for outdated or vulnerable packages and GitHub Actions. Opens pull requests; nothing is merged by itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # major upgrades (for example React 18 to 19) are done on purpose by hand, not by a weekly bot
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
