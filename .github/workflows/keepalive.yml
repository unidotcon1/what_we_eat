name: Keep Supabase awake

# Supabase free projects pause after about a week without activity.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (same values as the app uses).
on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one restaurant row
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
